general:
    seed: 838
    num_snapshots: 1000
    overwrite_output: false
    output_dir: campaigns/03_DC_MSS_ISOLADO/output/
    output_dir_prefix: output_dc_mss_isolado_Sys3_340km_LF20_PBO0dB_F0pct
    system: SINGLE_EARTH_STATION
    imt_link: DOWNLINK
    enable_adjacent_channel: false
    enable_cochannel: true
imt:
    minimum_separation_distance_bs_ue: 35
    interfered_with: false
    frequency: 2155.0
    bandwidth: 5.0
    rb_bandwidth: 0.18
    adjacent_antenna_model: SINGLE_ELEMENT
    adjacent_ch_reception: "OFF"
    adjacent_ch_emissions: ACLR
    spectral_mask: MSS
    spurious_emissions: -13 
    guard_band_ratio: 0.1
    topology:
        central_latitude: -25.5549751
        central_longitude: -54.5746686
        central_altitude: 200
        type: MSS_DC
        mss_dc:
            orbits:
                - n_planes: 48
                  inclination_deg: 53.0
                  perigee_alt_km: 340.0
                  apogee_alt_km: 340.0
                  sats_per_plane: 110
                  long_asc_deg: 1.875 #(checar se muda ao colocar 0)
                  phasing_deg: 97.5
                  initial_mean_anomaly: 48.75 #(checar se muda ao colocar 0)
            sat_is_active_if:
                conditions:
                    - LAT_LONG_INSIDE_COUNTRY
                    - MINIMUM_ELEVATION_FROM_ES
                minimum_elevation_from_es: 5
                lat_long_inside_country:
                    country_names:
                        - Brazil
                        # - Argentina # Isso vai variar para diferentes cenários a serem estudados (Depois)
            beam_positioning:
                type: SERVICE_GRID
                service_grid:
                    transform_grid_randomly: true
                    grid_in_zone:
                        type: FROM_COUNTRIES
                        from_countries:
                            country_names:
                                - Brazil
                                # - Argentina
                            margin_from_border: 25 # variar depois
                    grid_exclusion_zone:
                        type:
                        circle:
                            center_lat: -25.5549751
                            center_lon: -54.5746686
                            radius_km: 0
                    eligible_sats_margin_from_border: -200.0
                    minimum_service_angle: 32
            beam_radius: 25803
            power_control_zones:
                mode: ACTIVE_FRACTION
                power_backoff_db: 0.0
                affected_fraction: 0.0
                zones:
                    - power_backoff_db: 0.0
                      geometry:
                          type: FROM_COUNTRIES
                          from_countries:
                              country_names:
                                  - Brazil
                                  #   - Argentina
                              margin_from_border: 25 # Variar no gerador
                    - power_backoff_db: 0.0
                      geometry:
                          type: FROM_COUNTRIES
                          from_countries:
                              country_names:
                                  - Brazil
                                  #   - Argentina
                              margin_from_border: 0
    bs:
        adjacent_ch_leak_ratio: 50
        load_probability: 0.2 # Variar 0.1, 0.2 e 0.5
        conducted_power: 42.8 # -20.1 dBW/Hz + 30 + 10*log10(5e6) - 34.1 dBi = 42.8 dBm
        height: 340000.0
        noise_figure: 5.0
        ohmic_loss: 0.0
        antenna:
            pattern: ITU-R-S.1528-Taylor
            gain: 34.1
            itu_r_s_1528:
                slr: 20.0
                n_side_lobes: 2
                l_r: 1.6
                l_t: 1.6
                frequency: 2000
            array:
                normalization: false
                element_pattern: M2101
                element_max_g: 6.4
                element_phi_3db: 90
                element_theta_3db: 65
                n_rows: 1
                n_columns: 1
                element_am: 30
                element_sla_v: 30
                multiplication_factor: 12
    ue:
        k: 1
        k_m: 1
        indoor_percent: 0.0
        distribution_type: UNIFORM_IN_CELL
        distribution_distance: RAYLEIGH
        distribution_azimuth: UNIFORM
        tx_power_control: false
        p_o_pusch: -92.2
        alpha: 0.8
        p_cmax: 23
        power_dynamic_range: 63
        height: 1.5
        noise_figure: 9
        ohmic_loss: 0
        body_loss: 4
        antenna:
            array:
                element_pattern: FIXED
                element_max_g: -3
                n_rows: 1
                n_columns: 1
    uplink:
        attenuation_factor: 0.4
        sinr_min: -10
        sinr_max: 22
    downlink:
        attenuation_factor: 0.8
        sinr_min: -10
        sinr_max: 30
    channel_model: FSPL
    noise_temperature: 290
    imt_dl_intra_sinr_calculation_disabled: false

single_earth_station:
  frequency: 2155
  bandwidth: 29
  tx_power_density: -200
  noise_temperature: 728.4471 # NF = 4 dB (ITU-R  F.758-8) => T = T0*10^(NF/10) -> T0=290K (de acordo ITU-R  F.758-8)
  adjacent_ch_selectivity: 35
  channel_model: P619
  polarization_loss: 3
  geometry:
    height: 20 # Alterar no gerador (20m e 40m)
    azimuth:
      type: FIXED
      fixed: 0 # Alterar no gerador (0, 90, 180, 270)
    elevation:
      type: FIXED
      fixed: 0
    location:
      type: FIXED
      fixed:
        x: 0
        y: 0
  antenna:
    pattern: ITU-R F.1245_fs
    gain: 33.1
    itu_r_f_1245_fs:
      gain: 33.1
      diameter: 2 # Diameter calculated using using the gain relatio=> D = (lam/pi)*sqrt(G)
  adjacent_ch_reception: ACS
  season: SUMMER
  param_p619:
    earth_station_lat_deg: -25.5549751
    earth_station_alt_m: 200
    mean_clutter_height: low  # Alterar no gerador 
    below_rooftop: 60 # Alterar no gerador

