      height: 100%;
      display: block;
      background: #000;
    }
    .hud {
      position: absolute;
      right: 18px;
      bottom: 18px;
      display: grid;
      gap: 8px;
      pointer-events: none;
    }
    .badge {
      justify-self: end;
      padding: 8px 10px;
      border-radius: 999px;
      background: rgba(0,0,0,0.72);
      border: 1px solid rgba(255,255,255,0.16);

      font-weight: 600;

    const fps = 20;
    const video = document.getElementById("sim-video");
    const label = document.getElementById("coverage-label");
    const cursor = document.getElementById("coverage-cursor");
    const dot = document.getElementById("coverage-dot");
    const leftPad = 34;
    const topPad = 14;
    const plotWidth = 320 - 34 - 10;
    const plotHeight = 180 - 14 - 24;

    function updateHud() {
      if (!coverage.length) {
        return;
      }

      const frame = Math.min(
        coverage.length - 1,
        Math.max(0, Math.round(video.currentTime * fps))
      );
      const value = coverage[frame];
      const x = leftPad + (plotWidth * frame) / Math.max(1, coverage.length - 1);
      const y = topPad + (1 - value / 100) * plotHeight;

      cursor.setAttribute("x1", x.toFixed(2));
      cursor.setAttribute("x2", x.toFixed(2));
      dot.setAttribute("cx", x.toFixed(2));
      dot.setAttribute("cy", y.toFixed(2));
      label.textContent = `Cobertura: ${value.toFixed(1)}%`;
    }

    video.addEventListener("timeupdate", updateHud);
    video.addEventListener("loadedmetadata", updateHud);
    updateHud();
  </script>
